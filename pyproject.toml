[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-capiscio"
version = "0.1.0"
description = "Trust enforcement adapter for LangChain and LangGraph — powered by CapiscIO"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["langchain", "a2a", "trust", "security", "ai-agents", "capiscio"]
authors = [
    { name = "CapiscIO", email = "engineering@capisc.io" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "capiscio-sdk>=2.4.0",
    "langchain-core>=0.3",
]

[project.urls]
Homepage = "https://capisc.io"
Repository = "https://github.com/capiscio/langchain-capiscio"
Documentation = "https://docs.capisc.io/integrations/langchain"
Issues = "https://github.com/capiscio/langchain-capiscio/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_capiscio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
